name: n900
base: ubuntu@24.04
actions:
  toolchain: sudo apt-get update && sudo apt-get install -y build-essential gcc-arm-linux-gnueabi g++-arm-linux-gnueabi binutils-arm-linux-gnueabi file dpkg-dev python3 git ninja-build make pkg-config qemu-user
  sysroot: python3 scripts/fetch_sysroot.py
  hello: mkdir -p build && scripts/maemo-gcc -O2 -o build/hello src/hello.c && file build/hello && qemu-arm -L /project/sysroot build/hello
