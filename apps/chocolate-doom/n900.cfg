# Extra settings of Chocolate Doom on the N900 (the launcher passes this file with -extraconfig; it overrides chocolate-doom.cfg, the rest of that file stays yours).
# The frame is drawn into a texture in the format of the window (RGB565, patched in build.sh), which the software renderer of SDL 2 copies and scales fast:
# the smooth scaling (an intermediate 960x600 texture) would only add work.
smooth_pixel_scaling          0
# The keyboard of the phone has no Esc key: Backspace opens and closes the menu (Quit game: arrows, Enter, then Y).
key_menu_activate             14
# Sound effects are precached at the start (long with 44.1 kHz); the sounds of Doom are 11 kHz.
snd_samplerate                22050
snd_cachesize                 16777216
