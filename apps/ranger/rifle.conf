# vim: ft=cfg
#
# rifle.conf of ranger for the Nokia N900 (Maemo 5). It replaces the default file of ranger (the phone has no atool, xdg-open or desktop browsers).
# Syntax: see the comments of the original ranger/config/rifle.conf: "<condition>, <condition> = command", the first matching line is the default,
# the others are offered by "r" (open with) in ranger. $1 is the first selected file, $@ all of them.
#
# The applications of the phone are opened through hildon-open, which calls the D-Bus method of the application (mime_open, the same call as the
# file manager of the phone makes), so the file opens in the running Media Player, Image Viewer, ... and ranger stays where it is.
# The type of a file comes from its extension (and from the stand-in of file(1) in /opt/ranger/libexec for the others).

#-------------------------------------------
# Applications of the phone
#-------------------------------------------
ext jpe?g|png|gif|tiff?|bmp, has hildon-open, flag f = hildon-open image_viewer "$1"
mime ^image/(jpeg|png|gif|tiff), has hildon-open, flag f = hildon-open image_viewer "$1"
ext pdf, has hildon-open, flag f = hildon-open osso_pdfviewer "$1"
mime application/pdf, has hildon-open, flag f = hildon-open osso_pdfviewer "$1"
ext x?html?, has hildon-open, flag f = hildon-open browser "$1"
ext mp3|m4a|m4b|aac|ogg|oga|opus|flac|wav|wma|amr|mid|midi, has hildon-open, flag f = hildon-open mediaplayer "$1"
ext mp4|m4v|3gp|avi|mov|mkv|webm|wmv|flv|mpe?g|ogv, has hildon-open, flag f = hildon-open mediaplayer "$1"
mime ^audio/, has hildon-open, flag f = hildon-open mediaplayer "$1"
mime ^video/, has hildon-open, flag f = hildon-open mediaplayer "$1"
ext m3u8?|pls|xspf, has hildon-open, flag f = hildon-open mediaplayer "$1"

#-------------------------------------------
# Text and other files in the terminal
#-------------------------------------------
mime ^text, label editor = ${VISUAL:-$EDITOR} -- "$@"
mime ^text, label pager  = "$PAGER" -- "$@"
ext xml|json|csv|tex|py|pl|rb|js|sh|php|c|h|cpp|conf|cfg|ini|log|md|rst|yaml|yml|toml|ts|css|svg, label editor = ${VISUAL:-$EDITOR} -- "$@"
ext xml|json|csv|tex|py|pl|rb|js|sh|php|c|h|cpp|conf|cfg|ini|log|md|rst|yaml|yml|toml|ts|css|svg, label pager  = "$PAGER" -- "$@"
name ^[A-Z][a-z]*file$|^README.*|^LICENSE.*|^Makefile$, label editor = ${VISUAL:-$EDITOR} -- "$@"
ext sh, label run = sh -- "$1"
ext py, has python3, label run = python3 -- "$1"

#-------------------------------------------
# Players in the terminal (the Media Player above is the default)
#-------------------------------------------
mime ^audio|ogg$, terminal, has mplayer, label mplayer = mplayer -- "$@"
ext mp3|m4a|m4b|aac|ogg|oga|opus|flac|wav|wma, terminal, has mplayer, label mplayer = mplayer -- "$@"
mime ^video, terminal, has mplayer, label mplayer = mplayer -- "$@"
ext mp4|m4v|3gp|avi|mov|mkv|webm|wmv|flv|mpe?g|ogv, terminal, has mplayer, label mplayer = mplayer -- "$@"

#-------------------------------------------
# Archives and packages: list the content (extract with the commands of ranger or the shell)
#-------------------------------------------
ext zip|jar|apk|xpi, has unzip, label list = unzip -l "$1" | "$PAGER"
ext tar|tgz|tbz2|txz|tar\.(gz|bz2|xz), has tar, label list = tar tvf "$1" | "$PAGER"
ext gz|bz2|xz, has tar, label list = tar tvf "$1" | "$PAGER"
ext deb, has dpkg, label list = dpkg -c "$1" | "$PAGER"
ext deb, has dpkg, label info = dpkg -I "$1" | "$PAGER"

#-------------------------------------------
# Everything else
#-------------------------------------------
label editor, !mime ^text, !ext xml|json|csv|tex|py|pl|rb|js|sh|php|c|h|cpp|conf|cfg|ini|log|md|rst|yaml|yml|toml|ts|css|svg = ${VISUAL:-$EDITOR} -- "$@"
label pager,  !mime ^text, !ext xml|json|csv|tex|py|pl|rb|js|sh|php|c|h|cpp|conf|cfg|ini|log|md|rst|yaml|yml|toml|ts|css|svg = "$PAGER" -- "$@"
