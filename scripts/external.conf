# Packages that are built by their authors, not by us: the central index of the repository (read by scripts/external-fetch.py, make external / make repo).
# One repository of the author, one package, one line:
#   NAME  GITHUB-REPO  TAG  ASSET  SHA256  [key=value ...]
#   NAME    the Package field the .deb must have
#   ASSET   the .deb file in the release TAG of GITHUB-REPO (https://github.com/REPO/releases/download/TAG/ASSET)
#   SHA256  of the file: the copy is verified against it, so a release that was replaced later is noticed and nothing unreviewed gets into the repository
#   keys    license=SPDX  (the licence of the package, checked by hand before it is added)
#           note=TEXT     shown by make external
# The copy goes to pool/main/NAME/ like our own packages (the history of versions stays there). To update: read the new release, change TAG, ASSET and SHA256.
# `make updates` compares TAG with the newest release (the lines with `external` in scripts/upstream.conf).
