# Upstream sources of the applications in apps/, read by scripts/upstream-check.py (make updates).
# One line per application:  APP  KIND  REF  [key=value ...]
#   KIND   github   REF = owner/repo        releases first, tags when there is no release (or tags=1)
#          gitlab   REF = group/project     tags
#          crate    REF = crate name        crates.io (cargo-install.sh builds)
#          gomod    REF = module path       proxy.golang.org (go-install.sh builds)
#          pypi     REF = project name
#          index    REF = URL of a page or directory listing; key re= is a regex whose group 1 is the version
#          golang   REF = -                 the stable Go release (go.dev)
#          local    REF = -                 our own package, no upstream
#          pinned   REF = -                 built from a fixed commit, no release to compare
#   keys   re=REGEX      version from a tag/file name (group 1); default strips a name prefix and a leading v
#          series=3.11   only versions starting with this (we stay on one branch)
#          ver=FILE:REGEX  used version from a file when the Makefile has none (REGEX group 1)
#          note=TEXT     shown in the last column
age             github  FiloSottile/age         note="1.3 needs Go 1.25 (we have 1.24)"
amfora          github  makew0rld/amfora
apt-n900        local   -
apt-transport-curl local -
bash            index   https://ftp.gnu.org/gnu/bash/   re=bash-(\d+\.\d+(?:\.\d+)?)\.tar\.gz
bat             github  sharkdp/bat
bt-kbmouse      local   -
busybox         index   https://busybox.net/downloads/  re=busybox-(\d+\.\d+\.\d+)\.tar\.bz2
ca-certs-n900  local   -                       note="CA certificates (Mozilla bundle through the curl package)"
camel-lite      pinned  -                       note="community-ssu/tinymail commit"
cbonsai         gitlab  jallbrit/cbonsai
cmatrix         github  abishekvashok/cmatrix
curl            github  curl/curl               re=^curl-(\d+_\d+_\d+)$
dialog          index   https://deb.debian.org/debian/pool/main/d/dialog/  re=dialog_(1\.3-\d+)\.orig\.tar\.gz  note="tarball from the Debian archive"
fd              crate   fd-find
file            index   https://astron.com/pub/file/  re=file-(\d+\.\d+)\.tar\.gz
fzf             github  junegunn/fzf
git             github  git/git                 tags=1
glib2           index   https://download.gnome.org/sources/glib/2.66/  re=glib-(\d+\.\d+\.\d+)\.tar\.xz  note="we stay on the 2.66 series; newer series untested (TODO)"
gnutls          index   https://www.gnupg.org/ftp/gcrypt/gnutls/v3.8/  re=gnutls-(\d+\.\d+\.\d+)\.tar\.xz  note="libraries around it (GMP, Nettle, libtasn1, libgcrypt) have fixed versions in apps/gnutls/build.sh"
go              golang  -                       series=1.24  ver=apps/go/build.sh:GO_VERSION:-([0-9.]+)  note="patched 1.24 (apps/go); newer Go changes the syscalls"
gpodder         pinned  -                       note="commit of gpodder/gpodder"
gurk            github  boxdot/gurk-rs
hildonlite      local   -
htop            github  htop-dev/htop
ical-sync       local   -
irssi           github  irssi/irssi
jq              github  jqlang/jq
libsignal-purple local  -
libstrophe      github  strophe/libstrophe
links           index   http://links.twibright.com/download/  re=links-(\d+\.\d+)\.tar\.bz2
mc              index   http://ftp.midnight-commander.org/  re=mc-(\d+\.\d+\.\d+)\.tar\.xz
micro           github  zyedidia/micro
microb-nss      pinned  -                       note="NSS 3.28.6 chosen on purpose (TLS 1.2, old build system, dbm); newer needs gyp and sql databases"
msmtp           github  marlam/msmtp-mirror     tags=1  re=^msmtp-(\d+\.\d+\.\d+)$  note="GitHub mirror (marlam.de refuses scripts)"
mutt            index   http://ftp.mutt.org/pub/mutt/  re=mutt-(\d+\.\d+\.\d+)\.tar\.gz
mutt-hildon     local   -
nano            index   https://ftp.gnu.org/gnu/nano/  re=nano-(\d+\.\d+(?:\.\d+)?)\.tar\.xz
ncdu            index   https://dev.yorhel.nl/download/  re=ncdu-(\d+\.\d+(?:\.\d+)?)\.tar\.gz  series=1.  note="2.x is written in Zig"
ntp-sync        local   -
openssh         index   https://cdn.openbsd.org/pub/OpenBSD/OpenSSH/portable/  re=openssh-(\d+\.\d+p\d+)\.tar\.gz
openssl         github  openssl/openssl         series=3.5  note="LTS branch 3.5"
profanity       github  profanity-im/profanity
purple-echo     local   -
python3         index   https://www.python.org/ftp/python/  re=href="(3\.11\.\d+)/"  series=3.11  note="branch 3.11"
quickjs         index   https://bellard.org/quickjs/  re=quickjs-(\d{4}-\d{2}-\d{2})\.tar\.xz
ranger          pypi    ranger-fm
ripgrep         crate   ripgrep
rsync           github  RsyncProject/rsync
rust            local   -                       note="rustup stable, unversioned"
screen          index   https://ftp.gnu.org/gnu/screen/  re=screen-(\d+\.\d+\.\d+)\.tar\.gz
selfie          local   -
sfeed           index   https://codemadness.org/releases/sfeed/  re=sfeed-(\d+\.\d+)\.tar\.gz
signal-bridge   local   -
smb             local   -                       note="own client on libsmb2 6.3 (github sahlberg/libsmb2)"
strace          github  strace/strace
terminfo-256color local -
tig             github  jonas/tig
tmux            github  tmux/tmux
tty-clock       github  xorg62/tty-clock        tags=1
vim9            github  vim/vim                 tags=1
weechat         github  weechat/weechat
wget            index   https://ftp.gnu.org/gnu/wget/  re=wget-(\d+\.\d+(?:\.\d+)?)\.tar\.gz
whiptail        index   https://deb.debian.org/debian/pool/main/n/newt/  re=newt_(\d+\.\d+\.\d+)\.orig\.tar  note="newt, tarball from the Debian archive"
wireguard-go    index   https://git.zx2c4.com/wireguard-go/refs/tags  re=wireguard-go-(\d+\.\d+\.\d+)\.tar
wordgrinder     github  davidgiven/wordgrinder tags=1
xml-tools       index   https://download.gnome.org/sources/libxml2/2.15/  re=libxml2-(\d+\.\d+\.\d+)\.tar\.xz  note="libxml2 series 2.15 (libxslt 1.1.45 needs >= 2.15.1)"
