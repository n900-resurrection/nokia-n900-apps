[package]
name = "async-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
# tokio (mio: epoll) is what gurk-rs/presage are built on; the 2.6.28 kernel of the N900 has no epoll_pwait
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "net", "time", "macros", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
