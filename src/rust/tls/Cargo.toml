[package]
name = "tls-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
# rustls with the ring provider (C and assembly, built with the cross gcc) and the bundled Mozilla CA roots: no system certificate files needed
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
